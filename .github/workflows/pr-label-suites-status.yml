name: PR Label Suites Status

# Posts one commit status per label suite (`suite: <job id>`), because the merge box only lists the
# checks of the newest PR Label Suites run. Each run rebuilds every status of the commit from all
# its PR Label Suites runs: for each suite, the newest run where the suite ran wins.
# Runs from the default branch with the base repository's token and never checks out PR code.

on:
  workflow_run:
    workflows: [PR Label Suites]
    types: [requested, completed]

permissions:
  actions: read
  statuses: write

# Queued one at a time per commit; a dropped pending run is fine since the next one rebuilds all.
concurrency:
  group: pr-label-suites-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { head_sha: sha, workflow_id } = context.payload.workflow_run;
            // Top-level jobs of pr-label-suites.yml that are not suites.
            const setupJobs = new Set(['changes']);
            const suiteOf = job => job.name.split(' / ')[0];

            async function load() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id, head_sha: sha, per_page: 100 });
              for (const run of runs) {
                run.jobs = (await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 }))
                  .filter(job => !setupJobs.has(suiteOf(job)));
                // Suite jobs are listed together once `changes` ends, so before that nothing is known.
                run.settled = run.status === 'completed' || run.jobs.length > 0;
              }
              // A rerun counts as newer than the runs started before it.
              return runs.sort((a, b) => Date.parse(b.run_started_at ?? b.created_at) - Date.parse(a.run_started_at ?? a.created_at));
            }

            let runs = await load();
            for (let i = 0; i < 40 && runs.some(run => !run.settled); i++) {
              await new Promise(resolve => setTimeout(resolve, 15000));
              runs = await load();
            }

            // A suite ran when it has jobs beyond its single skipped (or cancelled before start) row.
            const ran = jobs => jobs.some(job => job.name.includes(' / ')
              || !['skipped', 'cancelled'].includes(job.conclusion));
            const latest = new Map();
            for (const run of runs.filter(run => run.settled)) {
              const bySuite = Map.groupBy(run.jobs, suiteOf);
              for (const [suite, jobs] of bySuite)
                if (!latest.has(suite) && ran(jobs))
                  latest.set(suite, { run, jobs });
            }

            function statusOf({ run, jobs }) {
              if (run.status !== 'completed')
                return { state: 'pending', description: 'Running', target_url: run.html_url };
              const failed = jobs.find(job => ['failure', 'timed_out', 'startup_failure'].includes(job.conclusion));
              if (failed)
                return { state: 'failure', description: `Failed: ${failed.name}`, target_url: failed.html_url };
              const other = jobs.find(job => !['success', 'skipped'].includes(job.conclusion));
              if (other)
                return { state: 'error', description: `${other.conclusion ?? 'unknown'}: ${other.name}`, target_url: other.html_url };
              return { state: 'success', description: 'Passed', target_url: run.html_url };
            }

            const { data: current } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha, per_page: 100 });
            for (const [suite, entry] of latest) {
              const name = `suite: ${suite}`;
              const status = statusOf(entry);
              status.description = status.description.slice(0, 140);
              const old = current.statuses.find(s => s.context === name);
              core.info(`${name}: ${status.state} (${status.description}) from run ${entry.run.id}`);
              if (old && old.state === status.state && old.description === status.description && old.target_url === status.target_url)
                continue;
              await github.rest.repos.createCommitStatus({ owner, repo, sha, context: name, ...status });
            }
